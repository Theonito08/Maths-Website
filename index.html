<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Question Papers & Mark Schemes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media (max-width: 768px) {
      .grid {
        gap: 0.75rem;
      }
      input, select, button {
        font-size: 16px;
      }
    }

    @media (max-width: 600px) {
      table thead {
        display: none;
      }
      table, tbody, tr, td {
        display: block;
        width: 100%;
      }
      tr {
        margin-bottom: 1rem;
        padding: 0.75rem;
        border: 1px solid var(--pico-muted-border-color);
        border-radius: var(--pico-border-radius);
        background: var(--pico-card-background-color);
      }
      td {
        border: none;
        padding: 0.35rem 0;
      }
      td:first-child {
        font-weight: bold;
        font-size: 1.1rem;
        padding-bottom: 0.5rem;
      }
      td:nth-child(2):empty {
        display: none;
      }
      td a {
        display: inline-block;
        padding: 0.4rem 0.75rem;
        margin-top: 0.25rem;
        margin-right: 0.5rem;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <nav>
        <ul>
          <li>
            <h1 style="margin-bottom: 0;">Exam Papers & Mark Schemes</h1>
          </li>
        </ul>
        <ul id="adminControls" style="display: none;">
          <li><button class="contrast" onclick="openUploadModal()">+ Add Paper</button></li>
          <li><button class="secondary outline" onclick="logout()">Logout</button></li>
        </ul>
      </nav>
      <p>Download practice question papers and official mark schemes below.</p>
    </header>

    <div class="grid">
      <input type="search" id="searchInput" placeholder="Search by subject or topic..." aria-label="Search papers">
      <select id="yearFilter" aria-label="Filter by year">
        <option value="">All Years</option>
      </select>
    </div>

    <figure>
      <table id="papersTable" class="striped">
        <thead>
          <tr>
            <th scope="col">Subject / Topic</th>
            <th scope="col">Year</th>
            <th scope="col">Question Paper</th>
            <th scope="col">Mark Scheme</th>
            <th scope="col" class="admin-col" style="display: none;">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" aria-busy="true">Loading papers...</td></tr>
        </tbody>
      </table>
    </figure>

    <footer style="margin-top: 3rem; text-align: right;">
      <small><a href="#" id="loginLink" onclick="document.getElementById('loginModal').showModal(); return false;">Admin Login</a></small>
    </footer>
  </main>

  <dialog id="loginModal">
    <article>
      <header>
        <button aria-label="Close" rel="prev" onclick="document.getElementById('loginModal').close()"></button>
        <strong>Admin Login</strong>
      </header>
      <form id="loginForm">
        <label>Email <input type="email" id="adminEmail" required></label>
        <label>Password <input type="password" id="adminPassword" required></label>
        <p id="loginError" style="color: var(--pico-del-color); display: none;"></p>
        <button type="submit" id="loginBtn">Log In</button>
      </form>
    </article>
  </dialog>

  <dialog id="uploadModal">
    <article>
      <header>
        <button aria-label="Close" rel="prev" onclick="document.getElementById('uploadModal').close()"></button>
        <strong>Add New Exam Paper</strong>
      </header>
      <form id="uploadForm">
        <div class="grid">
          <label>Subject / Topic
            <input type="text" id="topicInput" required>
          </label>
          <label>Year
            <input type="text" id="yearInput" required>
          </label>
        </div>
        <label>Question Paper (PDF)
          <input type="file" id="qpFile" accept="application/pdf" required>
        </label>
        <label>Mark Scheme (PDF - Optional)
          <input type="file" id="msFile" accept="application/pdf">
        </label>
        <button type="submit" id="uploadBtn">Upload & Publish</button>
      </form>
    </article>
  </dialog>

  <script>
    const SUPABASE_URL = 'https://vhhnoimrtcsrjquacucw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Hz9k6LYylv_4cXpiqfcu9Q_z0zEEi23';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allPapers = [];
    let isAdmin = false;

    const tableBody = document.getElementById('tableBody');
    const yearFilter = document.getElementById('yearFilter');
    const searchInput = document.getElementById('searchInput');

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      isAdmin = !!session;
      document.getElementById('adminControls').style.display = isAdmin ? 'flex' : 'none';
      document.getElementById('loginLink').style.display = isAdmin ? 'none' : 'inline';
      document.querySelectorAll('.admin-col').forEach(el => el.style.display = isAdmin ? '' : 'none');
      renderTable();
    }

    async function loadPapers() {
      const { data, error } = await sb.from('papers').select('*').order('id', { ascending: false });
      if (error) {
        tableBody.innerHTML = `<tr><td colspan="5">Error loading papers. Check your Supabase keys.</td></tr>`;
        return;
      }
      allPapers = data;
      updateYearDropdown();
      renderTable();
    }

    function updateYearDropdown() {
      const currentVal = yearFilter.value;
      const years = [...new Set(allPapers.map(p => p.year))].sort().reverse();
      yearFilter.innerHTML = '<option value="">All Years</option>' + 
        years.map(y => `<option value="${y}">${y === '0000' ? 'No Year' : y}</option>`).join('');
      yearFilter.value = currentVal;
    }

    function renderTable() {
      const search = searchInput.value.toLowerCase();
      const selectedYear = yearFilter.value;

      const filtered = allPapers.filter(p =>
        p.topic.toLowerCase().includes(search) &&
        (selectedYear === '' || p.year === selectedYear)
      );

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="${isAdmin ? 5 : 4}"><em>No matching exam papers found.</em></td></tr>`;
        return;
      }

      tableBody.innerHTML = filtered.map(p => `
        <tr>
          <td>${p.topic}</td>
          <td>${p.year === '0000' ? '' : p.year}</td>
          <td>${p.qp_url ? `<a href="${p.qp_url}" target="_blank" rel="noopener" role="button" class="outline">Download QP</a>` : '—'}</td>
          <td>${p.ms_url ? `<a href="${p.ms_url}" target="_blank" rel="noopener" role="button" class="outline secondary">Download MS</a>` : '—'}</td>
          ${isAdmin ? `<td><button class="outline contrast" style="padding: 0.3rem 0.6rem;" onclick="deletePaper('${p.id}')">Delete</button></td>` : ''}
        </tr>
      `).join('');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.setAttribute('aria-busy', 'true');
      errEl.style.display = 'none';

      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('adminEmail').value,
        password: document.getElementById('adminPassword').value
      });

      btn.removeAttribute('aria-busy');
      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
      } else {
        document.getElementById('loginModal').close();
        checkAuth();
      }
    });

    async function logout() {
      await sb.auth.signOut();
      checkAuth();
    }

    function openUploadModal() {
      document.getElementById('uploadForm').reset();
      document.getElementById('uploadModal').showModal();
    }

    async function uploadPdfFile(file) {
      if (!file) return '';
      const cleanName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
      const { error } = await sb.storage.from('pdfs').upload(cleanName, file);
      if (error) throw error;
      const { data } = sb.storage.from('pdfs').getPublicUrl(cleanName);
      return data.publicUrl;
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('uploadBtn');
      btn.setAttribute('aria-busy', 'true');

      try {
        const topic = document.getElementById('topicInput').value;
        const year = document.getElementById('yearInput').value;
        const qpFile = document.getElementById('qpFile').files[0];
        const msFile = document.getElementById('msFile').files[0];

        const qpUrl = await uploadPdfFile(qpFile);
        const msUrl = await uploadPdfFile(msFile);

        const { error } = await sb.from('papers').insert([{ topic, year, qp_url: qpUrl, ms_url: msUrl }]);
        if (error) throw error;

        document.getElementById('uploadModal').close();
        await loadPapers();
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        btn.removeAttribute('aria-busy');
      }
    });

    async function deletePaper(id) {
      if (!confirm('Remove this paper from the site?')) return;
      await sb.from('papers').delete().eq('id', id);
      await loadPapers();
    }

    searchInput.addEventListener('input', renderTable);
    yearFilter.addEventListener('change', renderTable);

    checkAuth();
    loadPapers();
  </script>
</body>
</html>
